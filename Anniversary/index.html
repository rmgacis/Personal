<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Anniversary</title>
  <link href="https://fonts.googleapis.com/css2?family=Over+the+Rainbow&family=DM+Sans:wght@400;500&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head>

<body>

  <main class="container-fluid p-0">
    <div class="row g-0">

      <div class="col-12 col-md-4">
        <div class="tile h-3 player">
          <div id="spotify">
          </div>
          <div class="tile under"><span class="ph">images/photo-10.jpg</span><img src="images/photo-10.jpg" style="object-position: 50% 60%;"
              alt="Our photo 10" onerror="this.remove()"></div>
        </div>
        <div class="row g-0">
          <div class="col-6">
            <div class="tile h-1"><span class="ph">images/photo-1.jpg</span><img src="images/photo-1.jpg" style="object-position: center 30%"
                alt="Our photo 1" onerror="this.remove()"></div>
          </div>
          <div class="col-6">
            <div class="tile h-1"><span class="ph">images/photo-2.jpg</span><img src="images/photo-2.jpg" 
                alt="Our photo 2" onerror="this.remove()"></div>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-5">
        <div class="tile h-1 code" id="code">
          <img src="images/song-code.png" alt="Our song" onerror="this.remove()" style="filter:none">
        </div>
        <div class="tile h-2"><span class="ph">images/photo-3.jpg</span><img src="images/photo-3.jpg" alt="Our photo 3"
            onerror="this.remove()"></div>
        <div class="row g-0">
          <div class="col-6">
            <div class="tile h-1"><span class="ph">images/photo-4.jpg</span><img src="images/photo-4.jpg" style="object-position: 50% 50%"
                alt="Our photo 4" onerror="this.remove()"></div>
          </div>
          <div class="col-6">
            <div class="tile h-1"><span class="ph">images/photo-5.jpg</span><img src="images/photo-5.jpg"
                alt="Our photo 5" onerror="this.remove()"></div>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-3">
        <div class="tile h-2"><span class="ph">images/photo-6.jpg</span><img src="images/photo-6.jpg" alt="Our photo 6"
            onerror="this.remove()"></div>
        <div class="row g-0">
          <div class="col-6">
            <div class="tile h-1 date">11/12/25</div>
          </div>
          <div class="col-6">
            <div class="tile h-1"><span class="ph">images/photo-7.jpg</span><img src="images/photo-7.jpg" style="object-position: center 30%"
                alt="Our photo 7" onerror="this.remove()"></div>
          </div>
        </div>
        <div class="row g-0">
          <div class="col-6">
            <div class="tile h-1"><span class="ph">images/photo-8.jpg</span><img src="images/photo-8.jpg" style="object-position: center 10%; transform: scale(1.2);"
                alt="Our photo 8" onerror="this.remove()"></div>
          </div>
          <div class="col-6">
            <div class="tile h-1"><span class="ph">images/photo-9.jpg</span><img src="images/photo-9.jpg" style="transform: scale(1.5); transform-origin: 50% 40%" 
                alt="Our photo 9" onerror="this.remove()"></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <button id="start" type="button">Click anywhere to play with sound</button>

  <script>
    (function () {
      var code = document.getElementById('code');
      var h = [30, 70, 55, 90, 40, 60, 35, 75, 85, 45, 65, 30, 80, 50, 95, 40, 70, 55, 85, 35, 60, 90, 45, 75, 30, 65, 80, 50, 70, 40, 85, 55];
      var logo = '<svg viewBox="0 0 100 100"><path fill-rule="evenodd" d="M50 0a50 50 0 1 0 0 100A50 50 0 0 0 50 0zm23 72c-1 1.5-3 2-4.500 1C55 64 38 62 22 66c-2 .5-3.500-.8-4-2.200-.5-2 .8-3.500 2.200-4 17.800-4 36-2.200 49.500 6 1.500 1 2 3 .8 4.200zm6-13c-1.200 1.800-3.500 2.400-5.300 1.200-14-8.600-34-11-50-6-2 .6-4.200-.6-4.800-2.600s.6-4.200 2.600-4.800c18.400-5.600 40.800-2.800 56.200 6.800 1.800 1.200 2.400 3.500 1.300 5.400zm.5-13.500C63.500 36 36.500 35 21 39.800c-2.500.8-5-.6-5.800-3-.8-2.500.6-5 3-5.800 17.800-5.400 47.500-4.300 66 6.700 2.200 1.300 3 4.200 1.600 6.400-1.300 2.200-4.200 3-6.300 1.600z"/></svg>';
      var bars = '<div class="bars">' + h.map(function (v) {return '<i style="height:' + v + '%"></i>';}).join('') + '</div>';
      if (!code.querySelector('img')) code.innerHTML = logo + bars;
      else code.querySelector('img').addEventListener('error', function () {code.innerHTML = logo + bars;});
    })();

    var START_SECONDS = 45;
    var SONG_URI = 'spotify:track:0JO9VhYHF6EI0KSw9xLI6A';

    var ctrl = null, seekPending = false;
    window.onSpotifyIframeApiReady = function (IFrameAPI) {
      IFrameAPI.createController(
        document.getElementById('spotify'),
        {uri: SONG_URI, width: '100%', height: '100%', startAt: START_SECONDS},
        function (c) {
          ctrl = c;
          c.addListener('playback_update', function (e) {
            if (seekPending && !e.data.isPaused) {
              seekPending = false;
              if (Math.abs(e.data.position / 1000 - START_SECONDS) > 2) c.seek(START_SECONDS);
            }
          });
        }
      );
    };

    document.getElementById('start').addEventListener('click', function () {
      document.body.classList.add('playing');
      if (ctrl) {seekPending = true; ctrl.play();}
    });
  </script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>

</html>
